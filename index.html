<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>北京·四日</title>
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#f0f2f5;--glass:rgba(255,255,255,.72);--glass-strong:rgba(255,255,255,.88);
  --text:#1a1a2e;--text2:#6b7280;--text3:#9ca3af;
  --sep:rgba(0,0,0,.06);--accent:#4f46e5;--red:#ef4444;--orange:#f59e0b;
  --green:#10b981;--blue:#3b82f6;--purple:#8b5cf6;
  --radius:16px;--radius-sm:10px;--safe-b:env(safe-area-inset-bottom,0px);
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.04);
  --shadow-lg:0 8px 32px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.04);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#f5f3ef;color:var(--text);line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
#map{width:100%;height:40vh;min-height:280px;position:sticky;top:0;z-index:100;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.1)}
.tab-area{position:sticky;top:40vh;z-index:99}
.tabs{
  display:flex;gap:6px;padding:10px 14px;overflow-x:auto;overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  background:rgba(255,255,255,.78);backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,.5);
  scrollbar-width:none;mask-image:linear-gradient(to right,#000 85%,transparent);
  -webkit-mask-image:linear-gradient(to right,#000 85%,transparent);
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex-shrink:0;padding:8px 18px;border-radius:99px;border:1px solid rgba(0,0,0,.06);
  background:#fff;color:var(--text2);font-size:14px;font-weight:600;
  cursor:pointer;touch-action:manipulation;user-select:none;
  transition:all .25s;white-space:nowrap;min-height:38px;box-shadow:0 1px 3px rgba(0,0,0,.04);
}
.tab:active{transform:scale(.96)}
.tab.active{
  background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;
  border-color:transparent;box-shadow:0 4px 12px rgba(79,70,229,.35);
}
.day-bar{
  display:none;gap:6px;padding:8px 14px;overflow-x:auto;
  background:rgba(255,255,255,.55);backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.4);
  scrollbar-width:none;
}
.day-bar.show{display:flex}
.day-bar::-webkit-scrollbar{display:none}
.day-pill{
  flex-shrink:0;padding:7px 16px;border-radius:99px;
  border:1px solid rgba(0,0,0,.06);background:#fff;
  color:var(--text2);font-size:13px;font-weight:600;
  cursor:pointer;touch-action:manipulation;user-select:none;
  white-space:nowrap;min-height:36px;transition:all .2s;
  box-shadow:0 1px 2px rgba(0,0,0,.03);
}
.day-pill:active{transform:scale(.96)}
.day-pill.active{
  background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;
  border-color:transparent;box-shadow:0 4px 12px rgba(79,70,229,.35);
}
.content{max-width:680px;margin:0 auto;padding:16px 14px calc(32px+var(--safe-b));min-height:60vh}
.hero{text-align:center;padding:28px 20px 20px}
.hero h1{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--text)}
.hero .sub{font-size:15px;color:var(--text2);margin-top:6px;font-weight:500}
.info-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.info-chip{
  flex:1 1 calc(50% - 4px);min-width:140px;
  background:#fff;border:1px solid rgba(0,0,0,.08);
  border-radius:var(--radius-sm);padding:14px 16px;box-shadow:var(--shadow-md);
}
.info-chip .label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.info-chip .value{font-size:15px;font-weight:700}
.card{
  background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:var(--radius);
  padding:16px 18px;margin-bottom:10px;box-shadow:var(--shadow-sm);
  transition:box-shadow .2s,transform .2s;
}
.card:active{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.card .time{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.02em}
.card .name{font-size:17px;font-weight:700;margin:4px 0;display:flex;align-items:center;gap:8px}
.card .desc{font-size:14px;color:var(--text2);line-height:1.55}
.card .budget{display:inline-block;margin-top:8px;padding:4px 12px;
  background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.25);
  border-radius:99px;font-size:12px;color:#b45309;font-weight:700}
.card-alert{margin-top:10px;padding:8px 12px;background:rgba(239,68,68,.06);
  border-left:3px solid var(--red);border-radius:0 8px 8px 0;
  font-size:12px;color:#b91c1c;line-height:1.55;font-weight:500}
.badge{display:inline-flex;align-items:center;font-size:10px;font-weight:800;
  padding:2px 8px;border-radius:6px;flex-shrink:0;letter-spacing:.02em}
.badge.attraction{background:rgba(59,130,246,.12);color:var(--blue)}
.badge.food{background:rgba(239,68,68,.1);color:var(--red)}
.badge.shopping{background:rgba(139,92,246,.1);color:var(--purple)}
.badge.hotel{background:rgba(245,158,11,.1);color:var(--orange)}
.badge.transport{background:rgba(107,114,128,.1);color:var(--text2)}.badge.drink{background:rgba(160,82,45,.1);color:#a0522d}
.day-head{padding:20px 0 12px}
.day-head h2{font-size:24px;font-weight:800;letter-spacing:-.02em}
.day-head p{font-size:14px;color:var(--text3);margin-top:3px;font-weight:500}
.sec-head{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;
  letter-spacing:.06em;padding:24px 0 10px;display:flex;align-items:center;gap:8px}
.sec-head::after{content:'';flex:1;height:1px;background:var(--sep)}
.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:8px;top:20px;bottom:20px;
  width:2px;background:linear-gradient(to bottom,var(--sep),rgba(0,0,0,.03));border-radius:1px}
.tl-item{position:relative;margin-bottom:12px}
.tl-dot{position:absolute;left:-19px;top:18px;width:12px;height:12px;border-radius:50%;
  z-index:1;border:3px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.06),0 2px 4px rgba(0,0,0,.15)}
.tl-dot.attraction{background:var(--blue)}
.tl-dot.food{background:var(--red)}
.tl-dot.shopping{background:var(--purple)}
.tl-dot.hotel{background:var(--orange)}
.tl-dot.transport{background:var(--text2)}.tl-dot.drink{background:#a0522d}
.budget-wrap{background:#fff;border:1px solid rgba(0,0,0,.08);
  border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-lg);margin-bottom:12px}
.budget-title{font-size:15px;font-weight:700;margin-bottom:12px}
.meal-table{width:100%;border-collapse:collapse;font-size:13px}
.meal-table th{text-align:left;padding:10px 8px;font-size:11px;font-weight:700;
  color:var(--text3);text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid rgba(0,0,0,.06)}
.meal-table td{padding:11px 8px;border-bottom:1px solid rgba(0,0,0,.04);vertical-align:top;font-weight:500}
.meal-table tr:last-child td{border-bottom:none}
.meal-table .total-row td{font-weight:800;font-size:15px;padding-top:14px;border-top:2px solid rgba(0,0,0,.08)}
.meal-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.meal-card{background:#fff;border:1px solid rgba(0,0,0,.08);
  border-radius:var(--radius-sm);padding:14px 16px;box-shadow:var(--shadow-sm);
  display:flex;gap:12px;align-items:flex-start}
.meal-card:active{box-shadow:var(--shadow-md)}
.meal-card .m-icon{width:42px;height:42px;border-radius:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:20px}
.meal-card .m-body{flex:1;min-width:0}
.meal-card .m-name{font-size:15px;font-weight:700}
.meal-card .m-meta{font-size:12px;color:var(--text3);margin-top:2px}
.meal-card .m-dish{font-size:13px;color:var(--text2);margin-top:3px}
.meal-card .m-note{font-size:11px;color:var(--orange);margin-top:3px;font-weight:600}
.meal-card .m-price{font-size:15px;font-weight:800;color:#b45309;flex-shrink:0;align-self:center}
.day-preview{background:#fff;border:1px solid rgba(0,0,0,.08);
  border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:8px;
  box-shadow:var(--shadow-sm);cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:12px}
.day-preview:active{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.day-preview .dp-dot{width:36px;height:36px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800}
.day-preview .dp-body{flex:1;min-width:0}
.day-preview .dp-title{font-size:15px;font-weight:700}
.day-preview .dp-route{font-size:12px;color:var(--text3);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.warn-card{background:#fff;border:1px solid rgba(239,68,68,.15);
  border-left:4px solid var(--red);border-radius:var(--radius-sm);
  padding:14px 16px;margin-bottom:8px;box-shadow:var(--shadow-sm)}
.warn-card .trap{font-weight:700;font-size:14px;color:var(--red)}
.warn-card .fix{font-size:13px;color:var(--text2);margin-top:3px;line-height:1.5}
.emer-card{background:linear-gradient(135deg,rgba(239,68,68,.06),rgba(245,158,11,.06));
  border:1px solid rgba(239,68,68,.15);border-radius:var(--radius-sm);
  padding:14px 16px;box-shadow:var(--shadow-sm)}
.emer-card .desc{font-size:13px;color:var(--text2);line-height:1.7;font-weight:600}
.weather-card{background:linear-gradient(135deg,rgba(59,130,246,.08),rgba(139,92,246,.06));
  border:1px solid rgba(59,130,246,.15);border-radius:var(--radius);
  padding:16px 18px;box-shadow:var(--shadow-sm);margin-bottom:12px}
.w-main{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.w-icon{font-size:36px}
.w-temp{font-size:24px;font-weight:800}
.w-desc{font-size:13px;color:var(--text2);margin-top:2px}
.w-forecast{display:flex;gap:8px}
.w-day{flex:1;text-align:center;padding:10px 6px;background:rgba(255,255,255,.5);border-radius:var(--radius-sm)}
.w-dname{font-size:11px;color:var(--text3);font-weight:600;margin-bottom:4px}
.w-dicon{font-size:22px;margin-bottom:2px}
.w-dtemp{font-size:13px;font-weight:700}
.w-dtemp span{color:var(--text3);font-weight:500}
.w-desc-sm{font-size:10px;color:var(--text3);margin-top:2px}
.chk-group{background:#fff;border:1px solid rgba(0,0,0,.08);
  border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:8px;box-shadow:var(--shadow-sm)}
.chk-group .chk-title{font-size:13px;font-weight:700;margin-bottom:8px}
.chk-items{display:flex;flex-wrap:wrap;gap:6px}
.chk-item{display:flex;align-items:center;gap:6px;padding:7px 12px;
  background:rgba(255,255,255,.6);border-radius:99px;font-size:13px;
  cursor:pointer;user-select:none;touch-action:manipulation;
  border:1px solid rgba(0,0,0,.06);transition:all .15s}
.chk-item:active{transform:scale(.97)}
.chk-item.done{opacity:.5}
.chk-item.done .chk-name{text-decoration:line-through}
.chk-item .chk-box{width:18px;height:18px;border-radius:50%;border:2px solid rgba(0,0,0,.15);
  display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;transition:all .15s}
.chk-item.done .chk-box{background:var(--green);border-color:var(--green);color:#fff}
.chk-tools{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.chk-all-btn{padding:6px 14px;border-radius:99px;border:1px solid rgba(0,0,0,.08);
  background:#fff;font-size:12px;font-weight:600;color:var(--text2);
  cursor:pointer;touch-action:manipulation;min-height:34px;transition:all .15s}
.chk-all-btn.active{background:var(--accent);color:#fff;border-color:transparent}
.chk-filter .chk-item.done{display:none}
.card .btn-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
.card .cbtn{display:inline-flex;align-items:center;gap:3px;padding:6px 12px;
  border-radius:99px;font-size:11px;font-weight:600;cursor:pointer;
  border:none;touch-action:manipulation;min-height:32px;text-decoration:none;letter-spacing:.01em}
.cbtn.nav{background:rgba(59,130,246,.1);color:var(--blue)}
.cbtn.xhs{background:rgba(255,36,66,.1);color:#ff2442}
.cbtn.dp{background:rgba(255,167,0,.1);color:#e08700}
.cbtn.rsv{background:rgba(16,185,129,.1);color:var(--green)}
.pay-row{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.pay-chip{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600}
.pay-chip.ok{background:rgba(16,185,129,.12);color:var(--green)}
.pay-chip.no{background:rgba(239,68,68,.08);color:var(--red)}
.lnk-row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.lnk-btn{display:inline-flex;align-items:center;gap:5px;padding:10px 18px;
  border-radius:99px;font-size:13px;font-weight:700;text-decoration:none;
  border:none;cursor:pointer;touch-action:manipulation;min-height:42px;
  white-space:nowrap;user-select:none;letter-spacing:.01em;
  box-shadow:0 2px 8px rgba(0,0,0,.1);transition:all .2s}
.lnk-btn:active{transform:scale(.97);filter:brightness(.9)}
.lnk-btn.reserve{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff}
.lnk-btn.app{background:#fff;border:1px solid rgba(0,0,0,.1);color:var(--text)}
.leaflet-popup-content-wrapper{border-radius:12px;font-family:inherit;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.leaflet-popup-content{font-size:13px;margin:10px 14px;line-height:1.5}
.leaflet-control-zoom a{width:36px;height:36px;line-height:36px;border-radius:10px}
.leaflet-container{background:#f0f2f5}
.poi-tooltip{background:rgba(255,255,255,.85)!important;border:none!important;
  box-shadow:0 1px 4px rgba(0,0,0,.1)!important;border-radius:6px!important;
  font-size:11px!important;font-weight:600!important;color:#333!important;padding:3px 8px!important}
.poi-tooltip::before{display:none!important}
.day-tooltip{background:transparent!important;border:none!important;
  box-shadow:none!important;font-size:10px!important;font-weight:700!important;
  color:#fff!important;padding:0!important}
.day-tooltip::before{display:none!important}
/* 苹果风格天气 */
.wx-now{text-align:center;padding:16px 0}
.wx-emoji{font-size:56px;margin-bottom:4px}
.wx-temp{font-size:52px;font-weight:200;letter-spacing:-.02em;color:var(--text)}
.wx-range{font-size:14px;color:var(--text2);margin-top:4px}
.wx-forecast{background:#fff;border:1px solid rgba(0,0,0,.08);
  border-radius:var(--radius);padding:12px 18px;box-shadow:var(--shadow-lg)}
.wx-row{display:flex;align-items:center;gap:8px;padding:10px 0}
.wx-row+.wx-row{border-top:1px solid var(--sep)}
.wx-day{width:40px;font-size:13px;font-weight:600;flex-shrink:0}
.wx-icon{font-size:20px;width:32px;text-align:center;flex-shrink:0}
.wx-lo{font-size:13px;color:var(--text3);width:32px;text-align:right;flex-shrink:0}
.wx-hi{font-size:13px;font-weight:600;width:32px;flex-shrink:0}
.wx-bar-wrap{flex:1;height:5px;background:rgba(0,0,0,.06);border-radius:3px;min-width:60px}
.wx-bar{height:100%;border-radius:3px;
  background:linear-gradient(90deg,#5e9cff,#3b82f6,#f59e0b,#ef4444)}
.src-foot{font-size:11px;color:var(--text3);text-align:center;padding:24px 0 8px;line-height:2.2}
.src-foot .src-tag{display:inline-block;padding:2px 10px;background:rgba(0,0,0,.03);border-radius:99px;margin:2px 4px;font-weight:500;font-size:11px}
</style>
</head>

var DAY_COLORS = {"1": "#e8835e", "2": "#5d8c7a", "3": "#7b9ec7", "4": "#c490b6", "5": "#e8b456", "6": "#d94f4f"};
var TICONS = {"attraction": "#3b82f6", "food": "#ef4444", "shopping": "#8b5cf6", "hotel": "#f59e0b", "transport": "#6b7280", "drink": "#a0522d"};
var TEMOJI = {"attraction": "★", "food": "🍜", "shopping": "🛍", "hotel": "🏨", "transport": "🚇", "drink": "🧋"};
var CLAT = 39.92;
var CLNG = 116.42;
var ZOOM = 12;

var map = null, allCoords = [], markers = [], polylines = [];

function initMap() {
  if (map || typeof L === 'undefined') return;
  try {
    map = L.map('map', {center: [CLAT, CLNG], zoom: ZOOM, zoomControl: false});
    L.control.zoom({position:'topright'}).addTo(map);
    L.tileLayer('https://webrd01.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=7&x={x}&y={y}&z={z}', {
      maxZoom: 18
    }).addTo(map);
    showDay(0);
  } catch(e) {}
}

function clearMap() {
  if (!map) return;
  markers.forEach(function(m) { map.removeLayer(m); });
  polylines.forEach(function(p) { map.removeLayer(p); });
  markers = [];
  polylines = [];
}

DATA.pois.forEach(function(p) { if (p.lat) allCoords.push([p.lat, p.lng]); });

function showDay(idx) {
  if (!map) return;
  clearMap();
  var coords = [];

  if (idx === 0) {
    // 总览：每 Day 一个标记
    (DATA.days || []).forEach(function(d) {
      var dc = [];
      DATA.pois.forEach(function(p) { if (p.day === d.id && p.lat) dc.push([p.lat, p.lng]); });
      if (!dc.length) return;
      var clat = 0, clng = 0;
      dc.forEach(function(c) { clat += c[0]; clng += c[1]; });
      clat /= dc.length; clng /= dc.length;
      var clr = DAY_COLORS[d.id] || '#888';
      var m = L.marker([clat, clng], {icon: L.divIcon({
        html: '<div style="width:38px;height:38px;background:' + clr + ';border:3px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:800;box-shadow:0 3px 10px rgba(0,0,0,.25)">D' + d.id + '</div>',
        className: '', iconSize:[38,38], iconAnchor:[19,19]
      })}).addTo(map);
      m.bindTooltip(d.title, {permanent:true, direction:'top', offset:[0,-22], className:'day-tooltip'});
      markers.push(m);
      coords.push([clat, clng]);
    });
    // 总览路线
    (DATA.routes || []).forEach(function(r) {
      var f = DATA.pois.find(function(p) { return p.name === r.from; });
      if (!f) f = DATA.pois.find(function(p) { return p.name.indexOf(r.from) >= 0 || r.from.indexOf(p.name) >= 0; });
      var t = DATA.pois.find(function(p) { return p.name === r.to; });
      if (!t) t = DATA.pois.find(function(p) { return p.name.indexOf(r.to) >= 0 || r.to.indexOf(p.name) >= 0; });
      if (!f || !t) return;
      var color = DAY_COLORS[r.day] || '#999';
      polylines.push(L.polyline([[f.lat,f.lng],[t.lat,t.lng]], {
        color:color, weight:2, opacity:0.4, dashArray:'8,5'
      }).addTo(map));
    });
  } else {
    // 单日：显示当天 POI，序号标记
    var dayPois = DATA.pois.filter(function(p) { return p.day === idx; });
    var dayRoutes = (DATA.routes || []).filter(function(r) { return r.day === idx; });

    dayPois.forEach(function(p, i) {
      if (!p.lat) return;
      var clr = TICONS[p.type] || '#888';
      var num = i + 1;
      var m = L.marker([p.lat, p.lng], {icon: L.divIcon({
        html: '<div style="width:24px;height:24px;background:' + clr + ';border:2.5px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.22)">' + num + '</div>',
        className: '', iconSize:[24,24], iconAnchor:[12,12], popupAnchor:[0,-14]
      })}).addTo(map);
      var pop = '<b>' + p.name + '</b>';
      if (p.time) pop += '<br>' + p.time;
      if (p.desc) pop += '<br>' + p.desc;
      m.bindPopup(pop);
      markers.push(m);
      coords.push([p.lat, p.lng]);
    });

    dayRoutes.forEach(function(r) {
      var f = DATA.pois.find(function(p) { return p.name === r.from; });
      if (!f) f = DATA.pois.find(function(p) { return p.name.indexOf(r.from) >= 0 || r.from.indexOf(p.name) >= 0; });
      var t = DATA.pois.find(function(p) { return p.name === r.to; });
      if (!t) t = DATA.pois.find(function(p) { return p.name.indexOf(r.to) >= 0 || r.to.indexOf(p.name) >= 0; });
      if (!f || !t) return;
      var color = DAY_COLORS[r.day] || '#999';
      polylines.push(L.polyline([[f.lat,f.lng],[t.lat,t.lng]], {
        color:color, weight:2.5, opacity:0.55, dashArray:'8,5'
      }).addTo(map));
    });
  }

  if (coords.length) map.fitBounds(coords, {padding: [40, 40], maxZoom: 15});
}

      var clr = mc[m.type] || '#6b7280';
      h += '<div class="meal-card"><div class="m-icon" style="background:' + clr + '18;color:' + clr + '">S</div>';
      h += '<div class="m-body"><div class="m-name">' + m.name + '</div><div class="m-meta">' + m.district + ' · ' + m.type + '</div>';
      h += '<div class="m-dish">' + m.dish + '</div>';
      if (m.note) h += '<div class="m-note">' + m.note + '</div>';
      h += '</div><div class="m-price">' + m.perPerson + '</div></div>';
    });
    h += '</div>';
  }

  if (DATA.warnings) {
    h += '<div class="sec-head">避坑指南</div>';
    DATA.warnings.forEach(function(w) { h += '<div class="warn-card"><div class="trap">' + w.trap + '</div><div class="fix">' + w.fix + '</div></div>'; });
  }

  if (DATA.emergency) {
    h += '<div class="sec-head">应急信息</div>';
    var em = DATA.emergency;
    h += '<div class="emer-card"><div class="desc">';
    if (em.police) h += '报警: ' + em.police + ' · ';
    if (em.ambulance) h += '急救: ' + em.ambulance + '<br>';
    if (em.hospital) h += '医院: ' + em.hospital;
    h += '</div></div>';
  }

  if (DATA.links) {
    h += '<div class="sec-head">快捷链接</div><div class="lnk-row">';
    DATA.links.forEach(function(l) { h += '<a class="lnk-btn ' + l.type + '" href="' + l.url + '" target="_blank">' + l.label + '</a>'; });
    h += '</div>';
  }
  if (DATA.sources && DATA.sources.length) {
    h += '<div class="src-foot"><div style="font-weight:600;margin-bottom:4px">数据来源</div>';
    DATA.sources.forEach(function(s) {
      h += '<span class="src-tag">' + s.platform + ' &middot; ' + s.date + ' &middot; ' + s.summary + '</span>';
    });
    h += '</div>';
  }
  return h;
}

function renderDay(idx) {
  var d = DATA.days.find(function(x) { return x.id === idx; });
  if (!d) return '';
  var h = '<div class="day-head"><h2>' + d.label + ' · ' + d.title + '</h2><p>' + d.date + '</p></div><div class="timeline">';
  (d.locations || []).forEach(function(l) {
    h += '<div class="tl-item"><div class="tl-dot ' + (l.type || 'attraction') + '"></div>';
    h += '<div class="card"><div class="time">' + l.time + '</div>';
    h += '<div class="name">' + badgeHtml(l.type) + ' ' + l.name + '</div><div class="desc">' + l.desc + '</div>';
    if (l.budget) h += '<div class="budget">' + l.budget + '</div>';
    if (l.alert) h += '<div class="card-alert">' + l.alert + '</div>';
    var btns = '';
    if (l.lat) btns += '<button class="cbtn nav" data-lat="' + l.lat + '" data-lng="' + l.lng + '" data-name="' + l.name.replace(/"/g, '&quot;') + '">导航</button>';
    if (l.xhs) btns += '<button class="cbtn xhs" data-xhs="' + l.xhs + '">小红书</button>';
    if (l.dianping) btns += '<button class="cbtn dp" data-dp="' + l.dianping + '">点评</button>';
    if (l.reserve) btns += '<a class="cbtn rsv" href="' + l.reserve + '" target="_blank">预约</a>';
    if (btns) h += '<div class="btn-row">' + btns + '</div>';
    if (l.pay) {
      var pl = {alipay:'支付宝', wechat:'微信', cash:'现金', card:'刷卡'};
      var ps = {1:'ok', 0.5:'idk', 0:'no'}, ph = '<div class="pay-row">';
      for (var k in l.pay) { var s = ps[l.pay[k]] || 'idk'; ph += '<span class="pay-chip ' + s + '">' + (pl[k] || k) + '</span>'; }
      h += ph + '</div>';
    }
    h += '</div></div>';
  });
  return h + '</div>';
}

function renderWeather() {
  var w = DATA.weather;
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var startIdx = 0, minDiff = Infinity;
  w.daily.forEach(function(d, i) {
    var dd = new Date(d.date + 'T00:00:00');
    var diff = Math.abs(dd - today);
    if (diff < minDiff) { minDiff = diff; startIdx = i; }
  });
  var days = w.daily.slice(startIdx, startIdx + 4);

  var allTemps = [];
  days.forEach(function(d) { allTemps.push(d.high); allTemps.push(d.low); });
  var tMin = Math.min.apply(null, allTemps);
  var tMax = Math.max.apply(null, allTemps);
  var tRange = tMax - tMin || 1;

  var wEmoji = {0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',51:'🌦️',53:'🌧️',61:'🌧️',80:'🌧️',95:'⛈️'};
  var wLabel = {0:'晴',1:'少云',2:'多云',3:'阴',45:'雾',51:'小雨',53:'小雨',61:'中雨',80:'阵雨',95:'雷暴'};

  var h = '<div class="hero"><h1>' + w.city + '</h1><p class="sub">天气预报</p></div>';
  var t = days[0];
  h += '<div class="wx-now">';
  h += '<div class="wx-emoji">' + (wEmoji[t.code] || '🌡️') + '</div>';
  h += '<div class="wx-temp">' + t.high + '°</div>';
  h += '<div class="wx-range">' + (wLabel[t.code] || '') + '  ' + t.low + '° ~ ' + t.high + '°</div>';
  h += '</div>';

  h += '<div class="wx-forecast">';
  days.forEach(function(d, i) {
    var lb = i === 0 ? '今天' : (d.date || '').slice(5);
    var leftPct = Math.round((d.low - tMin) / tRange * 100);
    var widthPct = Math.round((d.high - d.low) / tRange * 100);
    if (widthPct < 8) widthPct = 8;
    if (leftPct < 0) leftPct = 0;
    if (leftPct + widthPct > 100) widthPct = 100 - leftPct;

    h += '<div class="wx-row">';
    h += '<div class="wx-day">' + lb + '</div>';
    h += '<div class="wx-icon">' + (wEmoji[d.code] || '🌡️') + '</div>';
    h += '<div class="wx-lo">' + d.low + '°</div>';
    h += '<div class="wx-bar-wrap"><div class="wx-bar" style="margin-left:' + leftPct + '%;width:' + widthPct + '%"></div></div>';
    h += '<div class="wx-hi">' + d.high + '°</div>';
    h += '</div>';
  });
  return h + '</div>';
}
var DEFAULT_CHECKLIST = {
  '证件': ['身份证', '通行证/护照'],
  '电子设备': ['充电线', '充电宝', '耳机'],
  '洗漱化妆': ['梳子', '唇膏', '眼药水', '护手霜', '散粉', '口红', '睫毛夹'],
  '随身': ['抽纸', '小包纸', '手机挂绳'],
  '摄影': ['相机', '闪光灯', 'CCD', '相机电池'],
  '配饰': ['项链', '戒指'],
  '其他': ['水', '皮炎平']
};
function getChkPrefix() {
  return 'chk_' + (DATA.title || 'trip').replace(/[^a-zA-Z0-9\u4e00-\u9fff]/g, '').slice(0, 12) + '_';
}
var chkFilterOn = false;
function renderChecklist() {
  var h = '<div class="hero"><h1>物资清单</h1><p class="sub"><div class="chk-tools">';
  h += '<button class="chk-all-btn" id="chkAllBtn" onclick="toggleAllChk()">全部勾选</button>';
  h += '<button class="chk-all-btn" id="chkFilterBtn" onclick="toggleChkFilter()">只看未完成</button>';
  h += '<button class="chk-all-btn" id="chkResetBtn" onclick="resetChk()">重置</button>';
  h += '</div></p></div>';
  var groups = DATA.checklist || DEFAULT_CHECKLIST;
  var prefix = getChkPrefix();
  Object.keys(groups).forEach(function(g) {
    h += '<div class="chk-group"><div class="chk-title">' + g + '</div><div class="chk-items">';
    groups[g].forEach(function(item) {
      var key = prefix + g + '_' + item;
      h += '<div class="chk-item" data-chk="' + key + '"><div class="chk-box"></div><div class="chk-name">' + item + '</div></div>';
    });
    h += '</div></div>';
  });
  return h;
}

ctEl.addEventListener('click', function(e) {
  var item = e.target.closest('.chk-item');
  if (!item) return;
  var key = item.dataset.chk, isDone = item.classList.contains('done');
  if (isDone) { item.classList.remove('done'); localStorage.removeItem(key); }
  else { item.classList.add('done'); localStorage.setItem(key, '1'); }
});

// XHS button handler
ctEl.addEventListener('click', function(e) {
  var xhsBtn = e.target.closest('.cbtn.xhs');
  if (xhsBtn) {
    e.preventDefault();
    var url = xhsBtn.dataset.xhs;
    var appUrl = url.replace('https://www.xiaohongshu.com/search_result?keyword=', 'xhsdiscover://search/result?keyword=');
    // Try app first
    var start = Date.now();
    var iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.src = appUrl;
    document.body.appendChild(iframe);
    setTimeout(function() {
      document.body.removeChild(iframe);
      if (Date.now() - start < 1500) { window.open(url, "_blank"); }
    }, 1000);
    return;
  }
});

// 点评按钮：App优先，web兜底
ctEl.addEventListener('click', function(e) {
  var dpBtn = e.target.closest('.cbtn.dp');
  if (dpBtn) {
    e.preventDefault();
    var url = dpBtn.dataset.dp;
    var appUrl = 'dianping://web?url=' + encodeURIComponent(url);
    var start = Date.now();
    var iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.src = appUrl;
    document.body.appendChild(iframe);
    setTimeout(function() {
      document.body.removeChild(iframe);
      if (Date.now() - start < 1500) { window.open(url, '_blank'); }
    }, 1000);
    return;
  }
});

ctEl.addEventListener('click', function(e) {
  var btn = e.target.closest('.cbtn.nav');
  if (!btn) return;
  var name = btn.dataset.name, lat = parseFloat(btn.dataset.lat), lng = parseFloat(btn.dataset.lng);
  if (name && lat) openAmap(name, lat, lng);
});

function toggleAllChk() {
  var items = document.querySelectorAll('.chk-item');
  var allDone = Array.from(items).every(function(el) { return el.classList.contains('done'); });
  items.forEach(function(el) {
    if (allDone) { el.classList.remove('done'); localStorage.removeItem(el.dataset.chk); }
    else { el.classList.add('done'); localStorage.setItem(el.dataset.chk, '1'); }
  });
  var btn = document.getElementById('chkAllBtn');
  if (btn) btn.textContent = allDone ? '全部勾选' : '全部取消';
}
function toggleChkFilter() {
  chkFilterOn = !chkFilterOn;
  var ct = document.getElementById('content');
  var btn = document.getElementById('chkFilterBtn');
  if (chkFilterOn) { ct.classList.add('chk-filter'); if (btn) { btn.textContent = '显示全部'; btn.classList.add('active'); } }
  else { ct.classList.remove('chk-filter'); if (btn) { btn.textContent = '只看未完成'; btn.classList.remove('active'); } }
}
function resetChk() {
  var items = document.querySelectorAll('.chk-item');
  items.forEach(function(el) { el.classList.remove('done'); localStorage.removeItem(el.dataset.chk); });
}
function restoreChk() {
  var prefix = getChkPrefix();
  for (var i = 0; i < localStorage.length; i++) {
    var k = localStorage.key(i);
    if (k.indexOf(prefix) === 0) {
      var el = document.querySelector('[data-chk="' + k + '"]');
      if (el) el.classList.add('done');
    }
  }
}

var curDay = 1;
function go(idx) {
  cur = idx;
  // 主 tab 高亮
  var mainId = idx > 0 ? '行程' : (idx === 0 ? '总览' : (idx === -1 ? '天气' : '清单'));
  tabsEl.querySelectorAll('.tab').forEach(function(b) { b.classList.toggle('active', b.dataset.section === mainId); });
  // Day bar
  if (idx > 0) {
    curDay = idx;
    dayBar.classList.add('show');
    dayBar.querySelectorAll('.day-pill').forEach(function(b) { b.classList.toggle('active', +b.dataset.id === idx); });
  } else {
    dayBar.classList.remove('show');
  }
  // 内容
  if (idx === -1) ctEl.innerHTML = renderWeather();
  else if (idx === -2) { ctEl.innerHTML = renderChecklist(); setTimeout(restoreChk, 50); }
  else if (idx === 0) ctEl.innerHTML = renderOverview();
  else ctEl.innerHTML = renderDay(idx);
  window.scrollTo({top: 0, behavior: 'instant'});
  ctEl.scrollTop = 0;
  document.documentElement.scrollTop = 0;
  showDay(idx === -1 ? 0 : idx);
}

function addMainTab(section, isActive) {
  var btn = document.createElement('button');
  btn.className = 'tab' + (isActive ? ' active' : '');
  btn.dataset.section = section;
  btn.textContent = section;
  btn.addEventListener('click', function() {
    if (section === '行程') go(curDay || 1);
    else if (section === '总览') go(0);
    else if (section === '天气') go(-1);
    else if (section === '清单') go(-2);
  });
  tabsEl.appendChild(btn);
}
addMainTab('总览', true);
if (DATA.days && DATA.days.length) addMainTab('行程', false);
if (DATA.weather) addMainTab('天气', false);
if (DATA.checklist) addMainTab('清单', false);
// Day pills
if (DATA.days && DATA.days.length) {
  DATA.days.forEach(function(d) {
    var dp = document.createElement('button');
    dp.className = 'day-pill' + (d.id === 1 ? ' active' : '');
    dp.dataset.id = d.id;
    dp.textContent = d.label;
    dp.addEventListener('click', function() { go(d.id); });
    dayBar.appendChild(dp);
  });
}

function openAmap(name, lat, lng) {
  var enc = encodeURIComponent(name);
  var appUrl = 'amapuri://route/plan/?dlat=' + lat + '&dlng=' + lng + '&dname=' + enc + '&dev=0&t=0';
  var webUrl = 'https://uri.amap.com/navigation?to=' + lng + ',' + lat + ',' + enc + '&mode=car&coordinate=wgs84';
  var start = Date.now();
  var iframe = document.createElement('iframe');
  iframe.style.display = 'none';
  iframe.src = appUrl;
  document.body.appendChild(iframe);
  setTimeout(function() {
    document.body.removeChild(iframe);
    if (Date.now() - start < 1500) { window.open(webUrl, '_blank'); }
  }, 1000);
}

go(0);
setTimeout(initMap, 500);
</script>
